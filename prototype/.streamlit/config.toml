[theme]
base = "light"
primaryColor = "#23408E"
backgroundColor = "#F6F4F0"
secondaryBackgroundColor = "#EFEBE4"
textColor = "#1A1D21"
linkColor = "#23408E"
font = "IBM Plex Sans, system-ui, sans-serif"
headingFont = "IBM Plex Serif, Georgia, serif"
codeFont = "IBM Plex Mono, Menlo, monospace"
baseRadius = "0.5rem"
borderColor = "#DAD5CB"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#16232A"
secondaryBackgroundColor = "#1E2F38"
textColor = "#E6EBED"
primaryColor = "#E0A93A"
borderColor = "#2C3E48"
linkColor = "#E0A93A"

[browser]
gatherUsageStats = false
